# Open a "Log a coffee" issue (from your phone, say) and this adds it to
# data/coffee.csv, closes the issue, and redeploys. Only the repo owner's
# issues are accepted.
name: Log a coffee

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: deploy-log
  cancel-in-progress: false

jobs:
  log:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '### Score')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - id: log
        name: Add the rating to data/coffee.csv
        run: node scripts/log-coffee.ts
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Dates are recorded in this time zone.
          TZ: America/Los_Angeles

      - name: Commit
        env:
          MESSAGE: ${{ steps.log.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coffee.csv
          git commit -m "$MESSAGE"
          git push origin HEAD:main

      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ steps.log.outputs.comment }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$COMMENT"

      - name: Explain what went wrong
        if: failure() && steps.log.outputs.comment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ steps.log.outputs.comment }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$COMMENT"

  deploy:
    needs: log
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
      pages: write
      id-token: write
