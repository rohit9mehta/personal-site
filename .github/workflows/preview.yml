# Temporary (preview branch only): renders the real ratings on real map tiles
# and pushes screenshots to the ci-screenshots branch for review.
name: Preview screenshots

on:
  push:
    branches: [preview]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          node scripts/dev/preview-shots.ts http://localhost:4173/ shots /usr/bin/google-chrome
      - name: Publish
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Preview of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
