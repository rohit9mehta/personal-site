# Temporary: renders the site with real map tiles (which the dev sandbox can't
# reach) and pushes screenshots to the ci-screenshots branch for review.
name: Screenshots

on:
  push:
    branches: [coffee-map]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use the real ratings once there are any
        run: |
          if [ "$(wc -l < data/coffee.csv)" -gt 1 ]; then echo COFFEE_DATA=data; else echo COFFEE_DATA=fixtures/sample; fi >> "$GITHUB_ENV"
      - run: npm run build
      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          node scripts/dev/screenshot.ts http://localhost:4173/ shots /usr/bin/google-chrome
      - name: Publish
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Screenshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
