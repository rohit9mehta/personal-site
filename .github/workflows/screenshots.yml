# Temporary: renders the site with real map tiles (which the dev sandbox can't
# reach) and pushes screenshots to the ci-screenshots branch for review.
name: Screenshots

on:
  push:
    branches: [coffee-map]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use the real ratings once there are any
        run: |
          if [ "$(wc -l < data/coffee.csv)" -gt 1 ]; then echo COFFEE_DATA=data; else echo COFFEE_DATA=fixtures/sample; fi >> "$GITHUB_ENV"
      - name: Locate the real cafés and save them to this branch
        if: env.COFFEE_DATA == 'data'
        run: |
          npm run validate
          npm run enrich -- --prune | tee enrich.log
          if [ -n "$(git status --porcelain data/places.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/places.json
            git commit -qm "Locate coffee shops"
            git push origin HEAD:coffee-map || echo "::warning::branch moved on; locations not saved"
          fi
      - run: npm run build
      - name: Screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          node scripts/dev/screenshot.ts http://localhost:4173/ shots /usr/bin/google-chrome
      - name: Geocoder smoke test against live OpenStreetMap
        run: |
          mkdir -p /tmp/geo && cp fixtures/geocode-smoke/coffee.csv /tmp/geo/
          COFFEE_DATA=/tmp/geo npm run enrich 2>&1 | tee shots/geocode.txt
          cp /tmp/geo/places.json shots/geocode-places.json
      - name: Publish
        run: |
          [ -f enrich.log ] && cp enrich.log shots/ && cp data/places.json shots/places.json
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Screenshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
